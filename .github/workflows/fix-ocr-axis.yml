
name: Fix Quotex M1 OCR and Time Axis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Repair PriceScaleAnalyzer
        shell: bash
        run: |
          cat > app/src/main/java/com/example/quotexm1analyzer/PriceScaleAnalyzer.kt <<'EOF'
          package com.example.quotexm1analyzer

          data class PriceScalePoint(
              val price: Double,
              val y: Double
          )

          data class PriceScaleResult(
              val valid: Boolean,
              val pricePerPixel: Double?,
              val referencePrice: Double?,
              val referenceY: Double?,
              val pointsUsed: Int,
              val message: String
          )

          object PriceScaleAnalyzer {

              private val pricePattern = Regex(
                  """^\s*(\d{1,3}(?:,\d{3})*(?:\.\d{1,8})?|\d+(?:[.,]\d{1,8})?)\s*$"""
              )

              private fun parsePrice(text: String): Double? {
                  val cleaned = text
                      .replace('Ｏ', '0')
                      .replace('０', '0')
                      .replace('，', ',')
                      .replace('．', '.')
                      .trim()

                  val match = pricePattern.matchEntire(cleaned)
                      ?: return null

                  val token = match.groupValues[1]

                  val normalized = when {
                      token.contains('.') && token.contains(',') ->
                          token.replace(",", "")
                      token.contains(',') ->
                          token.replace(',', '.')
                      else -> token
                  }

                  return normalized.toDoubleOrNull()
              }

              fun analyze(
                  lines: List<PriceTextLine>,
                  screenWidth: Int,
                  screenHeight: Int
              ): PriceScaleResult {

                  if (screenWidth <= 0 || screenHeight <= 0) {
                      return invalid("Invalid screen dimensions.")
                  }

                  val minX = screenWidth * 0.80
                  val maxX = screenWidth * 1.00
                  val minY = screenHeight * 0.15
                  val maxY = screenHeight * 0.82

                  val axisLines = lines.filter { line ->
                      val x = (line.left + line.right) / 2.0
                      x in minX..maxX
                  }

                  val regionLines = axisLines.filter { line ->
                      val y = (line.top + line.bottom) / 2.0
                      y in minY..maxY
                  }

                  val points = regionLines.mapNotNull { line ->
                      val price = parsePrice(line.text)
                          ?: return@mapNotNull null

                      if (!price.isFinite() || price <= 0.0) {
                          return@mapNotNull null
                      }

                      PriceScalePoint(
                          price,
                          (line.top + line.bottom) / 2.0
                      )
                  }.distinctBy {
                      "${it.price}_${it.y.toInt()}"
                  }.sortedBy { it.y }

                  if (points.size < 3) {
                      return invalid(
                          "Price Scale: OCR=${lines.size}, axis=${axisLines.size}, region=${regionLines.size}, valid prices=${points.size}; 3 required.",
                          points.size
                      )
                  }

                  val meanY = points.map { it.y }.average()
                  val meanPrice = points.map { it.price }.average()

                  var numerator = 0.0
                  var denominator = 0.0

                  for (point in points) {
                      numerator +=
                          (point.y - meanY) *
                          (point.price - meanPrice)

                      denominator +=
                          (point.y - meanY) *
                          (point.y - meanY)
                  }

                  if (denominator <= 0.0) {
                      return invalid("Price scale denominator is zero.", points.size)
                  }

                  val slope = numerator / denominator
                  val intercept = meanPrice - slope * meanY

                  if (!slope.isFinite() || slope >= 0.0) {
                      return invalid("Price scale direction invalid.", points.size)
                  }

                  val errors = points.map {
                      kotlin.math.abs(
                          (intercept + slope * it.y) - it.price
                      )
                  }

                  val priceRange =
                      points.maxOf { it.price } -
                      points.minOf { it.price }

                  if (priceRange <= 0.0 ||
                      errors.average() > priceRange * 0.25
                  ) {
                      return invalid("Price labels do not match reliably.", points.size)
                  }

                  return PriceScaleResult(
                      valid = true,
                      pricePerPixel = slope,
                      referencePrice = meanPrice,
                      referenceY = meanY,
                      pointsUsed = points.size,
                      message = "Price Scale calibrated: ${points.size} labels."
                  )
              }

              private fun invalid(
                  message: String,
                  points: Int = 0
              ) = PriceScaleResult(
                  valid = false,
                  pricePerPixel = null,
                  referencePrice = null,
                  referenceY = null,
                  pointsUsed = points,
                  message = message
              )
          }
          EOF

      - name: Repair TimeAxisAnalyzer
        shell: bash
        run: |
          cat > app/src/main/java/com/example/quotexm1analyzer/TimeAxisAnalyzer.kt <<'EOF'
          package com.example.quotexm1analyzer

          import java.util.Calendar
          import java.util.TimeZone
          import kotlin.math.abs

          data class TimeAxisPoint(
              val x: Int,
              val minuteOfDay: Double
          )

          data class TimeAxisResult(
              val success: Boolean,
              val message: String,
              val points: List<TimeAxisPoint>
          ) {
              fun minuteAtX(x: Int): Double? {
                  if (!success || points.size < 2) return null

                  val sorted = points.sortedBy { it.x }

                  if (x < sorted.first().x || x > sorted.last().x) {
                      return null
                  }

                  for (i in 0 until sorted.lastIndex) {
                      val first = sorted[i]
                      val second = sorted[i + 1]

                      if (x in first.x..second.x) {
                          val width = second.x - first.x
                          if (width <= 0) return null

                          val fraction =
                              (x - first.x).toDouble() / width

                          return first.minuteOfDay +
                              (second.minuteOfDay - first.minuteOfDay) * fraction
                      }
                  }

                  return null
              }

              fun timestampAtX(
                  x: Int,
                  capturedAtMillis: Long
              ): Long? {
                  val chartMinute = minuteAtX(x) ?: return null

                  val minuteOfDay =
                      ((chartMinute % 1440.0) + 1440.0) % 1440.0

                  val timeZone = TimeZone.getDefault()

                  val base = Calendar.getInstance(timeZone).apply {
                      timeInMillis = capturedAtMillis
                      set(Calendar.HOUR_OF_DAY, 0)
                      set(Calendar.MINUTE, 0)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                  }

                  val candidates = (-1..1).map { dayOffset ->
                      val calendar = base.clone() as Calendar
                      calendar.add(Calendar.DAY_OF_MONTH, dayOffset)
                      calendar.add(Calendar.MINUTE, minuteOfDay.toInt())
                      calendar.timeInMillis
                  }

                  return candidates.minByOrNull {
                      abs(it - capturedAtMillis)
                  }
              }
          }

          class TimeAxisAnalyzer {

              companion object {
                  private val TIME_PATTERN =
                      Regex("""(?<!\d)([01]?\d|2[0-3]):([0-5]\d)(?!\d)""")

                  private const val MIN_LABELS = 2
              }

              fun analyze(
                  lines: List<PriceTextLine>,
                  screenWidth: Int,
                  screenHeight: Int
              ): TimeAxisResult {

                  if (screenWidth <= 0 || screenHeight <= 0) {
                      return failure("Invalid screen dimensions.")
                  }

                  // Keep chart-axis labels; ignore unrelated phone/UI times.
                  val chartLines = lines.filter { line ->
                      val x = (line.left + line.right) / 2.0
                      val y = (line.top + line.bottom) / 2.0
                      val ratio = y / screenHeight

                      x in (screenWidth * 0.18)..(screenWidth * 0.90) &&
                          ratio in 0.65..0.97
                  }

                  val rawPoints = chartLines.mapNotNull { line ->
                      val match = TIME_PATTERN.find(line.text)
                          ?: return@mapNotNull null

                      val hour = match.groupValues[1].toIntOrNull()
                          ?: return@mapNotNull null

                      val minute = match.groupValues[2].toIntOrNull()
                          ?: return@mapNotNull null

                      TimeAxisPoint(
                          x = (line.left + line.right) / 2,
                          minuteOfDay = (hour * 60 + minute).toDouble()
                      )
                  }.sortedBy { it.x }
                      .distinctBy { "${it.x}_${it.minuteOfDay}" }

                  if (rawPoints.size < MIN_LABELS) {
                      return failure(
                          "Time Axis: OCR=${lines.size}, chart region=${chartLines.size}, time labels=${rawPoints.size}; 2 required."
                      )
                  }

                  val unwrapped = mutableListOf<TimeAxisPoint>()
                  var dayOffset = 0.0
                  var previousMinute: Double? = null

                  for (point in rawPoints) {
                      var minute = point.minuteOfDay + dayOffset
                      val previous = previousMinute

                      if (previous != null && minute < previous) {
                          val difference = previous - minute

                          if (difference > 720.0) {
                              dayOffset += 1440.0
                              minute += 1440.0
                          } else {
                              continue
                          }
                      }

                      if (previousMinute != null &&
                          minute <= previousMinute!!
                      ) {
                          continue
                      }

                      unwrapped.add(
                          TimeAxisPoint(point.x, minute)
                      )

                      previousMinute = minute
                  }

                  if (unwrapped.size < MIN_LABELS) {
                      return failure(
                          "Time Axis: ${rawPoints.size} labels read, but their order is invalid."
                      )
                  }

                  for (i in 1 until unwrapped.size) {
                      val gap =
                          unwrapped[i].minuteOfDay -
                          unwrapped[i - 1].minuteOfDay

                      if (gap <= 0.0 || gap > 120.0) {
                          return failure(
                              "Time Axis: invalid gap between chart labels."
                          )
                      }
                  }

                  return TimeAxisResult(
                      success = true,
                      message = "${unwrapped.size} chart time labels detected.",
                      points = unwrapped
                  )
              }

              private fun failure(message: String) =
                  TimeAxisResult(
                      success = false,
                      message = message,
                      points = emptyList()
                  )
          }
          EOF

      - name: Preserve Price Scale diagnostic count
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/quotexm1analyzer/CandleScreenAnalyzer.kt")
          s = p.read_text()
          old = '''            return failure(scale.message)'''
          new = '''            return failure(scale.message, scale.pointsUsed)'''
          if old not in s:
              raise SystemExit("Could not find Price Scale failure call; no unsafe replacement made.")
          s = s.replace(old, new, 1)
          old2 = '''    private fun failure(message: String): ScreenAnalysisResult {
        return ScreenAnalysisResult(
            success = false,
            message = message,
            scalePoints = 0,
            candles = emptyList()
        )
    }'''
          new2 = '''    private fun failure(
        message: String,
        scalePoints: Int = 0
    ): ScreenAnalysisResult {
        return ScreenAnalysisResult(
            success = false,
            message = message,
            scalePoints = scalePoints,
            candles = emptyList()
        )
    }'''
          if old2 not in s:
              raise SystemExit("Could not find failure function; no unsafe replacement made.")
          p.write_text(s.replace(old2, new2, 1))
          PY

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/quotexm1analyzer/PriceScaleAnalyzer.kt
          git add app/src/main/java/com/example/quotexm1analyzer/TimeAxisAnalyzer.kt
          git add app/src/main/java/com/example/quotexm1analyzer/CandleScreenAnalyzer.kt
          git commit -m "Repair Quotex OCR price and time axis"
          git push

      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload repaired APK
        uses: actions/upload-artifact@v4
        with:
          name: Quotex-M1-OCR-Axis-Repaired-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
