 
name: Repair M1 Dashboard Complete

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Repair M1 pipeline
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("app/src/main/java/com/example/quotexm1analyzer")
          axis_file = root / "TimeAxisAnalyzer.kt"
          service_file = root / "ScreenCaptureService.kt"

          axis = axis_file.read_text()

          # Repair time-axis mapping, allowing only limited
          # extrapolation outside the first and last time labels.
          pattern = r"""        if \(x < sorted\.first\(\)\.x \|\| x > sorted\.last\(\)\.x\) \{
                      return null
                  \}

                  for \(i in 0 until sorted\.lastIndex\) \{"""

          replacement = """        // Allow bounded extrapolation for candles slightly
                  // outside the first or last detected time label.
                  val first = sorted.first()
                  val last = sorted.last()
                  val firstGap = sorted[1].x - first.x
                  val lastGap = last.x - sorted[sorted.lastIndex - 1].x
                  if (firstGap <= 0 || lastGap <= 0) return null

                  if (x < first.x) {
                      if (first.x - x > firstGap) return null
                      val next = sorted[1]
                      val fraction = (x - first.x).toDouble() / firstGap
                      return first.minuteOfDay +
                          (next.minuteOfDay - first.minuteOfDay) * fraction
                  }

                  if (x > last.x) {
                      if (x - last.x > lastGap) return null
                      val previous = sorted[sorted.lastIndex - 1]
                      val fraction = (x - previous.x).toDouble() /
                          (last.x - previous.x)
                      return previous.minuteOfDay +
                          (last.minuteOfDay - previous.minuteOfDay) * fraction
                  }

                  for (i in 0 until sorted.lastIndex) {"""

          axis, count = re.subn(pattern, lambda _: replacement, axis, count=1)

          if count != 1:
              raise SystemExit(
                  "ERROR: TimeAxis code pattern not found exactly once. "
                  "No source files were changed."
              )

          old_filter = "centerX > screenWidth * 0.92"
          if old_filter not in axis:
              raise SystemExit(
                  "ERROR: Time label filter not found. No source files were changed."
              )

          axis = axis.replace(
              old_filter,
              "centerX > screenWidth * 0.99",
              1
          )

          service = service_file.read_text()

          old_field = """    private val candleHistory = ScreenCandleHistory()

              private var lastFrameTime = 0L"""

          new_field = """    private val candleHistory = ScreenCandleHistory()
              private val signalNotifier by lazy { SignalNotifier(this) }
              private var lastNotifiedSignalCloseTime = 0L

              private var lastFrameTime = 0L"""

          if old_field not in service:
              raise SystemExit(
                  "ERROR: ScreenCaptureService field pattern not found. "
                  "No source files were changed."
              )

          service = service.replace(old_field, new_field, 1)

          old_count = """                                                latestClosedCandleCount =
                                                    candleHistory.getCount()

                                                // 4. Prepare diagnostic status"""

          new_count = """                                                latestClosedCandleCount =
                                                    candleHistory.getCount()

                                                // Analyze only after a new candle closes.
                                                // Require 35 real, consecutive M1 candles.
                                                if (newlyClosed.isNotEmpty()) {
                                                    val history =
                                                        candleHistory.getClosedCandles()
                                                    val recent = history.takeLast(35)

                                                    val continuous =
                                                        recent.size == 35 &&
                                                        recent.zipWithNext().all { (a, b) ->
                                                            b.closeTimeMillis -
                                                                a.closeTimeMillis == 60_000L
                                                        }

                                                    val newestCloseTime =
                                                        recent.lastOrNull()?.closeTimeMillis ?: 0L

                                                    if (continuous &&
                                                        newestCloseTime >
                                                            lastNotifiedSignalCloseTime
                                                    ) {
                                                        val result =
                                                            AnalysisEngine.analyze(recent)

                                                        if (result.signal != Signal.WAIT &&
                                                            result.strength >= 63
                                                        ) {
                                                            signalNotifier.showSignal(
                                                                signal = result.signal.name,
                                                                strength = result.strength,
                                                                reason = result.explanation
                                                                    .take(2)
                                                                    .joinToString(" ")
                                                            )
                                                        }

                                                        lastNotifiedSignalCloseTime =
                                                            newestCloseTime
                                                    }
                                                }

                                                // 4. Prepare diagnostic status"""

          if old_count not in service:
              raise SystemExit(
                  "ERROR: Closed-candle insertion point not found. "
                  "No source files were changed."
              )

          service = service.replace(old_count, new_count, 1)

          # Write files only after every required pattern was verified.
          axis_file.write_text(axis)
          service_file.write_text(service)

          print("SUCCESS: M1 repair changes applied.")

          PY

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quotex-M1-Dashboard-Complete-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save repaired source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/quotexm1analyzer/TimeAxisAnalyzer.kt
          git add app/src/main/java/com/example/quotexm1analyzer/ScreenCaptureService.kt
          if ! git diff --cached --quiet; then
            git commit -m "Repair M1 dashboard pipeline"
            git push
          fi
