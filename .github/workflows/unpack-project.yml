
name: Install Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          unzip -q Quotex_M1_Screen_Analyzer_READY_SOURCE.zip -d /tmp/project
          cp -a /tmp/project/QuotexM1ScreenAnalyzer/. .
          rm Quotex_M1_Screen_Analyzer_READY_SOURCE.zip

      - name: Save project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install complete Quotex analyzer project" || echo "No changes"
          git push
